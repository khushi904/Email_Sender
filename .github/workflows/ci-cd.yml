name: Email Sender CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean verify

      - name: Build Docker Image
        run: docker build -t email-sender:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: docker tag email-sender:latest ${{ secrets.DOCKER_USERNAME }}/email-sender:latest

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/email-sender:latest